services:
  mysql:
    image: mariadb:11
    container_name: tjurispro-mysql
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - ./data/mysql:/var/lib/mysql
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12

  app:
    build: .
    image: tjurispro-app:local
    container_name: tjurispro
    restart: unless-stopped
    env_file: .env
    environment:
      # O bloqueio de login por IP usa request.client.host. Atrás do nginx + docker-proxy
      # todo mundo chegaria com o IP do gateway do Docker (3 erros de qualquer pessoa
      # travariam o login de TODOS). O nginx grava o IP real em X-Forwarded-For
      # (sobrescrevendo, sem aceitar o que o cliente mandar) e o uvicorn passa a usá-lo.
      # "*" é seguro aqui porque a porta só é publicada em 127.0.0.1 (só o nginx alcança).
      FORWARDED_ALLOW_IPS: "*"
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "127.0.0.1:8082:8000"
    volumes:
      - ./data/backups:/app/backups
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
