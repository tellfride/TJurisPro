<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>JurisPRO — Relatórios</title>
  <link rel="icon" href="/assets/img/favicon.png" />
  <link rel="stylesheet" href="/assets/css/theme.css" />
  <link rel="stylesheet" href="/assets/css/styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebarSlot"></aside>
    <div class="main-area">
      <header class="topbar" id="topbarSlot"></header>
      <main class="content">
        <div class="card" style="max-width:560px;">
          <h3>Exportar histórico de transações</h3>
          <p class="text-muted" style="font-size:0.85rem;">
            Baixa uma planilha .xlsx com todos os pagamentos e quitações registrados
            (data, cliente, valor pago, multa e lucro de juros de cada transação).
          </p>

          <div class="field mt-1" id="companyFieldWrap" style="display:none;">
            <label for="companySelect">Empresa</label>
            <select id="companySelect">
              <option value="">Todas as empresas</option>
            </select>
          </div>

          <div class="field-row mt-1">
            <div class="field">
              <label for="dateFrom">De</label>
              <input type="date" id="dateFrom" />
            </div>
            <div class="field">
              <label for="dateTo">Até</label>
              <input type="date" id="dateTo" />
            </div>
          </div>

          <div class="error-box hidden" id="exportError"></div>

          <div class="form-actions" style="justify-content:flex-start;">
            <button class="btn btn-primary" id="exportBtn">⬇ Baixar histórico (.xlsx)</button>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/common.js"></script>
  <script src="/assets/js/relatorios.js"></script>
</body>
</html>
