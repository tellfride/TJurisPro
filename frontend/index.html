<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>JurisPRO — Entrar</title>
  <link rel="icon" href="/assets/img/favicon.png" />
  <link rel="stylesheet" href="/assets/css/theme.css" />
  <link rel="stylesheet" href="/assets/css/styles.css" />
</head>
<body>
  <div class="login-shell">
    <div class="login-card">
      <img src="/assets/img/logo.png" alt="JurisPRO" />
      <h1>JurisPRO</h1>
      <p class="subtitle">Sistema de cobrança com juros</p>

      <div class="error-box hidden" id="errorBox"></div>

      <form id="loginForm">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" required autocomplete="username" />
        </div>
        <div class="field">
          <label for="password">Senha</label>
          <input type="password" id="password" required autocomplete="current-password" />
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;" id="submitBtn">Entrar</button>
      </form>
    </div>
  </div>

  <button class="theme-toggle" id="themeToggle" style="position:fixed;top:1rem;right:1rem;" title="Alternar tema">🌙</button>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/common.js"></script>
  <script>
    document.getElementById("themeToggle").addEventListener("click", toggleTheme);
    renderAppFooter(document.querySelector(".login-shell"));

    function landingPage(user) {
      if (user.role === "consultor" && !consultorPerm(user, "view_dashboard")) return "/clientes.html";
      return "/dashboard.html";
    }

    if (getToken() && getUser()) {
      window.location.href = landingPage(getUser());
    }

    document.getElementById("loginForm").addEventListener("submit", async (ev) => {
      ev.preventDefault();
      const errorBox = document.getElementById("errorBox");
      const submitBtn = document.getElementById("submitBtn");
      errorBox.classList.add("hidden");
      submitBtn.disabled = true;
      submitBtn.textContent = "Entrando...";
      try {
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        const result = await api.post("/auth/login", { email, password });
        setSession(result.access_token, result.user);
        window.location.href = landingPage(result.user);
      } catch (err) {
        errorBox.textContent = err.message || "Não foi possível entrar";
        errorBox.classList.remove("hidden");
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Entrar";
      }
    });
  </script>
</body>
</html>
