# Cabeçalhos de segurança do JurisPRO (nginx). Inclua no bloco server E em todo location que use
# add_header: o nginx NÃO herda add_header do server para um location que defina o seu.
# Uso: include snippets/tjurispro-security-headers.conf;

add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://viacep.com.br; frame-ancestors 'none'; base-uri 'none'; object-src 'none'; form-action 'self'" always;
